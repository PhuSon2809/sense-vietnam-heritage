.sv-drop { animation: sv-drop 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both }
.sv-scan { animation: sv-scan 2.2s ease-in-out infinite alternate }
.sv-twinkle { animation: sv-twinkle 1.6s ease-in-out infinite }
.sv-confetti > span { position: absolute; top: 0; animation: sv-fall 3.4s linear infinite }
.sv-pop { animation: sv-pop 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) 0.3s both }
