<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Photo – thư viện ảnh địa danh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}; height: {{h}}; position: relative; overflow: hidden; font-family: Inter, sans-serif; color: #0D281E; background: {{bg}}">
  <sc-if value="{{hasSrc}}" hint-placeholder-val="{{ false }}">
    <img src="{{src}}" alt="{{alt}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{pos}}; display: block">
  </sc-if>
  <sc-if value="{{noSrc}}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="{{placeholderLabel}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; box-sizing: border-box; text-align: center; background-image: {{pattern}}">
      <svg aria-hidden="true" width="{{iconSize}}" height="{{iconSize}}" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg>
      <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 11.5px; font-weight: 600; line-height: 1.3; color: {{ink}}">{{subject}}</span>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"subject":{"editor":"enum","default":"Ngọ Môn","options":["Toàn cảnh Đại Nội","Ngọ Môn","Điện Thái Hòa","Ngai vàng","Bửu tán","Cột gỗ lim","Sân Đại Triều","Tử Cấm Thành","Thế Tổ Miếu","Cửu Đỉnh","Hoa văn Cửu Đỉnh","Cung Diên Thọ","Cung Trường Sanh","Nhã nhạc"]},"tone":{"editor":"enum","default":"light","options":["light","dark"]},"src":{"editor":"text","default":""},"pos":{"editor":"text","default":""},"w":{"editor":"text","default":"200px"},"h":{"editor":"text","default":"200px"},"alt":{"editor":"text","default":""},"hideLabel":{"editor":"boolean","default":false},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    // Thư viện ảnh: gắn đường dẫn ảnh thật cho từng địa danh tại đây, mọi màn hình dùng Photo sẽ tự cập nhật.
    var LIB = {
      'Toàn cảnh Đại Nội': 'img/684d0481b57442d47def5607701e3dc6.jpg',
      'Ngọ Môn': 'img/b94f7813045b074d1ae75e0e2df0291e.jpg',
      'Điện Thái Hòa': 'img/fd6d6817548021919106d1fb7c1167d9.jpg',
      'Ngai vàng': 'img/1739be40848a2ae8ffee4c1e8407ed4a.jpg',
      'Bửu tán': 'img/1739be40848a2ae8ffee4c1e8407ed4a.jpg',
      'Cột gỗ lim': 'img/fd6d6817548021919106d1fb7c1167d9.jpg',
      'Sân Đại Triều': 'img/00ea3379f270bc27e360a1def531f91f.jpg',
      'Tử Cấm Thành': 'img/00ea3379f270bc27e360a1def531f91f.jpg',
      'Thế Tổ Miếu': 'img/8eec6a13651e1c007cb4fa1c14b358c6.jpg',
      'Cửu Đỉnh': 'img/9c7394732b270aa8878172e1286aa8bd.jpg',
      'Hoa văn Cửu Đỉnh': 'img/26d0514957e27d8336a8922e157ddaf0.jpg',
      'Cung Diên Thọ': 'img/b27b97e9b72d63e13cadea54d7602496.jpg',
      'Cung Trường Sanh': 'img/9a02e792f028fd801357fb310b803ee3.jpg',
      'Nhã nhạc': 'img/170c64a243adad53ef94583046c01ebd.jpg'
    };
    // Khung ngắm mặc định cho từng ảnh (ảnh dùng chung được cắt vào chi tiết khác nhau).
    var POS = {
      'Bửu tán': '50% 18%',
      'Cột gỗ lim': '14% 70%',
      'Tử Cấm Thành': '82% 42%',
      'Sân Đại Triều': '50% 62%',
      'Ngai vàng': '50% 60%',
      'Điện Thái Hòa': '50% 55%',
      'Ngọ Môn': '50% 45%'
    };
    var subject = this.props.subject ?? 'Ngọ Môn';
    var src = this.props.src || LIB[subject] || '';
    var dark = (this.props.tone ?? 'light') === 'dark';
    var w = this.props.w ?? '200px';
    var h = this.props.h ?? '200px';
    var hide = this.props.hideLabel === true || this.props.hideLabel === 'yes' || this.props.hideLabel === 'true';
    return {
      w: w, h: h,
      subject: subject,
      src: src,
      hasSrc: src !== '',
      noSrc: src === '',
      alt: this.props.alt ?? '',
      pos: this.props.pos || POS[subject] || '50% 50%',
      bg: dark ? '#1F4A3D' : '#DDEAE3',
      ink: dark ? '#CFE3DA' : '#3E6156',
      pattern: dark
        ? 'repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 10px, rgba(255,255,255,0) 10px 20px)'
        : 'repeating-linear-gradient(135deg, rgba(14,124,91,0.06) 0 10px, rgba(14,124,91,0) 10px 20px)',
      iconSize: hide ? 18 : 24,
      showLabel: !hide,
      placeholderLabel: 'Khung ảnh: ' + subject
    };
  }
}
</script>
</body>
</html>
