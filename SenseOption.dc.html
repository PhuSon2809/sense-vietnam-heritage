<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SenseOption</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; font-family: Inter, sans-serif; background: {{s.bg}}; border: {{s.border}}">
  <span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{s.iconBg}}">
    <sc-if value="{{is.audio}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{s.fg}}" stroke-width="2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg></sc-if>
    <sc-if value="{{is.haptic}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{s.fg}}" stroke-width="2" stroke-linecap="round"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 8v8M20 8v8"></path></svg></sc-if>
    <sc-if value="{{is.ar}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{s.fg}}" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"></path><path d="M4 7.5 12 12l8-4.5M12 12v9"></path></svg></sc-if>
  </span>
  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
    <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.01em; color: {{s.fg}}">{{eyebrow}}</span>
      <sc-if value="{{hasBadge}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 5px; background: #FBF3DF; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #7D5100">{{badge}}</span></sc-if>
    </span>
    <span style="font-size: 16px; font-weight: 700; color: #0A3026">{{title}}</span>
    <span style="font-size: 13px; line-height: 1.45; color: {{s.body}}">{{desc}}</span>
    <sc-if value="{{hasStatus}}" hint-placeholder-val="{{ false }}"><span style="margin-top: 4px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{s.fg}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{s.fg}}"></span>{{status}}</span></sc-if>
    <sc-if value="{{c.link}}" hint-placeholder-val="{{ false }}"><a href="{{href}}" style="align-self: flex-start; margin-top: 6px; height: 44px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid {{s.fg}}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: {{s.fg}}; text-decoration: none">{{linkLabel}}</a></sc-if>
  </span>
  <sc-if value="{{c.toggle}}" hint-placeholder-val="{{ true }}"><dc-import name="Toggle" on="{{on}}" label="{{title}}" hint-size="52px,44px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sense":{"editor":"enum","default":"audio","options":["audio","haptic","ar"]},"eyebrow":{"editor":"text","default":"Khuyên dùng tai nghe"},"title":{"editor":"text","default":"Thính giác · Âm thanh 3D"},"desc":{"editor":"text","default":"Nhã nhạc và thuyết minh vang lên đúng hướng công trình."},"control":{"editor":"enum","default":"toggle","options":["toggle","link","none"]},"on":{"editor":"boolean","default":true},"linkLabel":{"editor":"text","default":"Nghe thử"},"href":{"editor":"text","default":"S12.dc.html"},"badge":{"editor":"text","default":""},"status":{"editor":"text","default":""},"$preview":{"width":361,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var sense = this.props.sense ?? 'audio';
    var S = {
      audio: { bg: '#E1EFEA', border: '1.5px solid #8ABFB0', iconBg: '#FFFFFF', fg: '#0B6B4E', body: '#2F5247' },
      haptic: { bg: '#FBF3DF', border: '1.5px solid #E5C77A', iconBg: '#FFFFFF', fg: '#7D5100', body: '#4F3A12' },
      ar: { bg: '#FFFFFF', border: '1.5px dashed #9DB8D3', iconBg: '#E8F0F8', fg: '#185FA5', body: '#456358' }
    };
    var ctl = this.props.control ?? 'toggle';
    var badge = this.props.badge ?? '';
    var status = this.props.status ?? '';
    var on = this.props.on === undefined ? true : (this.props.on === true || this.props.on === 'true' || this.props.on === 'yes');
    return {
      s: S[sense] || S.audio,
      is: { audio: sense === 'audio', haptic: sense === 'haptic', ar: sense === 'ar' },
      c: { toggle: ctl === 'toggle', link: ctl === 'link' },
      eyebrow: this.props.eyebrow ?? 'Khuyên dùng tai nghe',
      title: this.props.title ?? 'Thính giác · Âm thanh 3D',
      desc: this.props.desc ?? 'Nhã nhạc và thuyết minh vang lên đúng hướng công trình.',
      on: on,
      linkLabel: this.props.linkLabel ?? 'Nghe thử',
      href: this.props.href ?? 'S12.dc.html',
      badge: badge, hasBadge: badge !== '',
      status: status, hasStatus: status !== ''
    };
  }
}
</script>
</body>
</html>
