<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SenseCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<a href="{{href}}" style="width: 100%; box-sizing: border-box; display: flex; gap: 12px; padding: 10px; border-radius: 18px; text-decoration: none; font-family: Inter, sans-serif; color: #0D281E; background: {{cardBg}}; border: {{cardBorder}}; box-shadow: 0 2px 8px rgba(10, 48, 38, 0.05)">
  <span style="position: relative; width: {{thumb}}; height: {{thumb}}; flex: none; border-radius: 14px; overflow: hidden; display: grid">
    <dc-import name="Photo" subject="{{subject}}" w="100%" h="100%" hide-label="yes" hint-size="92px,92px"></dc-import>
    <sc-if value="{{hasNum}}" hint-placeholder-val="{{ true }}">
      <span style="position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: #FFFFFF; background: {{numBg}}; box-shadow: 0 1px 4px rgba(6, 40, 30, 0.3)">{{num}}</span>
    </sc-if>
  </span>
  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px">
    <span style="font-family: 'Playfair Display', serif; font-size: 18px; line-height: 1.2; font-weight: 700; color: #0A3026">{{title}}</span>
    <span style="font-size: 13px; line-height: 1.4; color: #456358">{{desc}}</span>
    <sc-if value="{{hasMeta}}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 12px; font-weight: 600; color: #2F5247">{{meta}}</span>
    </sc-if>
    <span style="display: flex; gap: 4px; flex-wrap: wrap">
      <sc-for list="{{tags}}" as="t" hint-placeholder-count="2">
        <dc-import name="SenseTag" sense="{{t.sense}}" label="{{t.label}}" hint-size="80px,20px"></dc-import>
      </sc-for>
    </span>
  </span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"subject":{"editor":"text","default":"Điện Thái Hòa"},"title":{"editor":"text","default":"Điện Thái Hòa"},"desc":{"editor":"text","default":"Nơi đặt ngai vàng, vua thiết triều"},"meta":{"editor":"text","default":"≈ 30 m · 25 phút"},"num":{"editor":"text","default":"2"},"tags":{"editor":"text","default":"audio,haptic"},"ar":{"editor":"boolean","default":false},"size":{"editor":"enum","default":"large","options":["large","compact"]},"href":{"editor":"text","default":"S08.dc.html"},"$preview":{"width":361,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    var ar = this.props.ar === true || this.props.ar === 'true' || this.props.ar === 'yes';
    var raw = this.props.tags ?? 'audio,haptic';
    var tags = String(raw).split(',').filter(function (x) { return x.trim() !== ''; }).map(function (x) {
      var p = x.split(':');
      return { sense: p[0].trim(), label: p[1] ? p[1].trim() : '' };
    });
    var num = this.props.num ?? '2';
    var meta = this.props.meta ?? '≈ 30 m · 25 phút';
    return {
      subject: this.props.subject ?? 'Điện Thái Hòa',
      title: this.props.title ?? 'Điện Thái Hòa',
      desc: this.props.desc ?? 'Nơi đặt ngai vàng, vua thiết triều',
      meta: meta,
      hasMeta: meta !== '',
      num: num,
      hasNum: num !== '',
      numBg: ar ? '#185FA5' : '#1B4D3E',
      tags: tags,
      href: this.props.href ?? 'S08.dc.html',
      thumb: (this.props.size ?? 'large') === 'compact' ? '68px' : '92px',
      cardBg: ar ? '#F3F7FB' : '#FFFFFF',
      cardBorder: ar ? '1.5px solid #9DB8D3' : '1px solid rgba(168, 206, 190, 0.55)'
    };
  }
}
</script>
</body>
</html>
