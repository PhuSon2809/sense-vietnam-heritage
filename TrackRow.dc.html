<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TrackRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(168, 206, 190, 0.55); font-family: Inter, sans-serif">
  <span style="width: 58px; height: 58px; flex: none; border-radius: 14px; overflow: hidden; display: grid">
    <dc-import name="Photo" subject="{{subject}}" w="100%" h="100%" hide-label="yes" hint-size="58px,58px"></dc-import>
  </span>
  <a href="{{href}}" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-decoration: none">
    <span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.01em; color: {{catInk}}">{{category}}</span><span style="font-size: 11.5px; color: #456358">· {{duration}}</span></span>
    <span style="font-size: 15px; font-weight: 700; color: #0A3026; line-height: 1.3">{{title}}</span>
    <span style="font-size: 12.5px; color: #456358; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sub}}</span>
  </a>
  <sc-if value="{{showDownload}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Tải về để nghe ngoại tuyến" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid #A8CEBE; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
  </sc-if>
  <sc-if value="{{showSaved}}" hint-placeholder-val="{{ true }}">
    <span aria-label="Đã tải" role="img" style="width: 22px; height: 22px; flex: none; border-radius: 50%; background: #E1EFEA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E7C5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
  </sc-if>
  <a href="{{href}}" aria-label="Phát {{title}}" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #E1EFEA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="#0E7C5B"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"subject":{"editor":"text","default":"Nhã nhạc"},"category":{"editor":"text","default":"Âm thanh 3D"},"duration":{"editor":"text","default":"3:12"},"title":{"editor":"text","default":"Trích đoạn Đại nhạc"},"sub":{"editor":"text","default":"Nghe riêng trống, kèn bầu, đàn nguyệt"},"state":{"editor":"enum","default":"downloaded","options":["downloaded","download"]},"tone":{"editor":"enum","default":"jade","options":["jade","amber","azure"]},"href":{"editor":"text","default":"S12.dc.html"},"$preview":{"width":361,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.props.state ?? 'downloaded';
    var T = { jade: '#0E7C5B', amber: '#7D5100', azure: '#185FA5' };
    return {
      subject: this.props.subject ?? 'Nhã nhạc',
      category: this.props.category ?? 'Âm thanh 3D',
      duration: this.props.duration ?? '3:12',
      title: this.props.title ?? 'Trích đoạn Đại nhạc',
      sub: this.props.sub ?? 'Nghe riêng trống, kèn bầu, đàn nguyệt',
      href: this.props.href ?? 'S12.dc.html',
      catInk: T[this.props.tone ?? 'jade'] || T.jade,
      showDownload: st === 'download',
      showSaved: st === 'downloaded'
    };
  }
}
</script>
</body>
</html>
