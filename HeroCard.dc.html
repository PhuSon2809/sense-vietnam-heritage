<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HeroCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: {{height}}; position: relative; overflow: hidden; border-radius: {{radius}}; box-shadow: 0 8px 24px rgba(6, 40, 30, 0.12); font-family: Inter, sans-serif">
  <div style="position: absolute; inset: 0; display: grid; animation: sv-kb 18s ease-in-out infinite alternate">
    <dc-import name="Photo" subject="{{subject}}" w="100%" h="100%" tone="dark" pos="{{pos}}" alt="{{alt}}" hint-size="100%,100%"></dc-import>
  </div>
  <sc-if value="{{hasChip}}" hint-placeholder-val="{{ true }}">
    <span style="position: absolute; top: 12px; left: 12px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.01em; background: {{chipBg}}; color: {{chipFg}}">{{chip}}</span>
  </sc-if>
  <sc-if value="{{hasText}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; background: rgba(6, 40, 30, 0.82); display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <sc-if value="{{hasEyebrow}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.01em; color: #F6BE39">{{eyebrow}}</span></sc-if>
          <span style="font-family: 'Playfair Display', serif; font-size: {{titleSize}}; line-height: 1.15; font-weight: 700; color: #FFFFFF">{{title}}</span>
          <sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; line-height: 1.45; color: #D9F8E8">{{sub}}</span></sc-if>
        </div>
        <sc-if value="{{hasBadge}}" hint-placeholder-val="{{ false }}"><span style="flex: none; padding: 4px 10px; border-radius: 999px; background: #F6BE39; font-size: 11.5px; font-weight: 700; color: #06281E">{{badge}}</span></sc-if>
      </div>
      <sc-if value="{{hasProgress}}" hint-placeholder-val="{{ false }}">
        <span style="display: block; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden"><span style="display: block; width: {{progressW}}; height: 100%; background: #F6BE39"></span></span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{ false }}">
    <a href="{{href}}" aria-label="{{title}}" style="position: absolute; inset: 0"></a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"subject":{"editor":"text","default":"Điện Thái Hòa"},"eyebrow":{"editor":"text","default":"Phân khu 2"},"title":{"editor":"text","default":"Điện Thái Hòa"},"sub":{"editor":"text","default":""},"chip":{"editor":"text","default":""},"chipTone":{"editor":"enum","default":"glass","options":["glass","gold","azure","dark"]},"badge":{"editor":"text","default":""},"progress":{"editor":"range","default":0,"min":0,"max":100,"unit":"%"},"height":{"editor":"int","default":200,"min":96,"max":480},"radius":{"editor":"int","default":24,"min":0,"max":32},"pos":{"editor":"text","default":""},"alt":{"editor":"text","default":""},"href":{"editor":"text","default":""},"$preview":{"width":361,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { glass: ['rgba(255, 255, 255, 0.92)', '#064D38'], gold: ['#F6BE39', '#06281E'], azure: ['#185FA5', '#FFFFFF'], dark: ['#0A3026', '#FFFFFF'] };
    var ct = C[this.props.chipTone ?? 'glass'] || C.glass;
    var title = this.props.title ?? 'Điện Thái Hòa';
    var eb = this.props.eyebrow ?? 'Phân khu 2';
    var sub = this.props.sub ?? '';
    var chip = this.props.chip ?? '';
    var badge = this.props.badge ?? '';
    var pr = Number(this.props.progress ?? 0);
    var href = this.props.href ?? '';
    var h = Number(this.props.height ?? 200);
    return {
      subject: this.props.subject ?? 'Điện Thái Hòa',
      pos: this.props.pos ?? '', alt: this.props.alt ?? '',
      height: h + 'px', radius: (this.props.radius ?? 24) + 'px',
      title: title, hasText: title !== '',
      eyebrow: eb, hasEyebrow: eb !== '',
      sub: sub, hasSub: sub !== '',
      chip: chip, hasChip: chip !== '', chipBg: ct[0], chipFg: ct[1],
      badge: badge, hasBadge: badge !== '',
      hasProgress: pr > 0, progressW: pr + '%',
      href: href, hasHref: href !== '',
      titleSize: h >= 240 ? '28px' : (h >= 160 ? '24px' : '19px')
    };
  }
}
</script>
</body>
</html>
