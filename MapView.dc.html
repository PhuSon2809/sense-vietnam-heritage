    <g fill="none" stroke="#B9A88A" stroke-width="0.9" stroke-dasharray="2 1.6">
      <rect x="158" y="88" width="46" height="24"></rect><rect x="146" y="64" width="16" height="18"></rect><rect x="200" y="64" width="16" height="18"></rect><rect x="160" y="62" width="42" height="16"></rect>

    <rect x="165" y="24" width="32" height="16" rx="1" fill="#E3A82F" stroke="#B9842A" stroke-width="0.8"></rect>
    <rect x="203" y="30" width="16" height="24" rx="1" fill="#E3A82F" stroke="#B9842A" stroke-width="0.8"></rect>
    <rect x="143" y="26" width="15" height="14" rx="1" fill="#E3A82F" stroke="#B9842A" stroke-width="0.8"></rect>
    <!-- Đại Cung Môn -->
    <rect x="167" y="124" width="28" height="9" rx="1" fill="#E3A82F" stroke="#B9842A" stroke-width="0.8"></rect>

    <rect x="146" y="138" width="70" height="60" fill="url(#pave)"></rect>
    <rect x="150" y="142" width="62" height="22" rx="1.5" fill="#E3A82F" stroke="#B9842A" stroke-width="0.9"></rect>
    <path d="M150 153H212" stroke="#B9842A" stroke-width="1"></path>
    <rect x="152" y="164" width="58" height="3" fill="#000000" fill-opacity="0.08"></rect>
    <rect x="175" y="167" width="12" height="70" fill="#CFC6B4"></rect>

    <rect x="118" y="202" width="54" height="22" rx="2" fill="#A9D3E6" stroke="#8CBFD6" stroke-width="0.8"></rect>
    <rect x="190" y="202" width="54" height="22" rx="2" fill="#A9D3E6" stroke="#8CBFD6" stroke-width="0.8"></rect>

    <rect x="156" y="236" width="50" height="11" rx="1" fill="#E3A82F" stroke="#B9842A" stroke-width="0.8"></rect>
    <rect x="148" y="236" width="9" height="9" fill="#7E9A6A"></rect><rect x="205" y="236" width="9" height="9" fill="#7E9A6A"></rect>

    <path d="M250 50c6-8 20-6 22 4s-8 14-16 12-10-8-6-16Z" fill="#A9D3E6" stroke="#8CBFD6" stroke-width="0.6"></path>
    <rect x="276" y="16" width="12" height="10" rx="1" fill="#E3A82F" stroke="#B9842A" stroke-width="0.8"></rect>

      <use href="#tr" x="260" y="224"></use><use href="#tr" x="276" y="222"></use><use href="#tr" x="244" y="140"></use><use href="#tr" x="288" y="138"></use>

    <text x="55.5" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#3F7EA0" transform="rotate(-90 55.5 110)">Hào Hoàng Thành</text>

    <text x="246" y="276" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#7A8580">Đường 23/8</text>

  <!-- Lộ trình -->
  <sc-if value="{{routeFull}}" hint-placeholder-val="{{ false }}">
    <svg aria-hidden="true" width="361" height="304" viewBox="0 0 361 304" style="position: absolute; left: 0; top: 0; pointer-events: none">
      <path d="M181 262V154V86H131V188H112" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M181 262V154V86H131V188H112" fill="none" stroke="#0E7C5B" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" style="animation: sv-dash 1s linear infinite"></path>
    </svg>
  </sc-if>
  <sc-if value="{{routeProgress}}" hint-placeholder-val="{{ false }}">
    <svg aria-hidden="true" width="361" height="304" viewBox="0 0 361 304" style="position: absolute; left: 0; top: 0; pointer-events: none">
      <path d="M181 262V154V86H131V188H112" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M181 120V86H131V188H112" fill="none" stroke="#0E7C5B" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" style="animation: sv-dash 1s linear infinite"></path>
      <path d="M181 262V120" fill="none" stroke="#0E7C5B" stroke-width="5" stroke-linecap="round"></path>
    </svg>
  </sc-if>
  <sc-if value="{{routeShort}}" hint-placeholder-val="{{ false }}">
    <svg aria-hidden="true" width="361" height="304" viewBox="0 0 361 304" style="position: absolute; left: 0; top: 0; pointer-events: none">
      <path d="M181 196V170" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"></path>
      <path d="M181 196V170" fill="none" stroke="#0E7C5B" stroke-width="4.5" stroke-linecap="round"></path>
    </svg>
  </sc-if>
  <!-- Ghim phân khu -->
  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <a href="{{pinHref}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.left}}; top: {{p.top}}; min-width: 44px; min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 1px; text-decoration: none; transform: translateX(-50%); animation: {{p.anim}}">
      <span style="width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: {{p.shadow}}; background: {{p.bg}}; border: 2px solid {{p.ring}}"><span style="transform: rotate(45deg); font-size: 11.5px; font-weight: 700; color: {{p.fg}}">{{p.n}}</span></span>
      <span style="margin-top: 3px; padding: 1px 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); font-size: 11.5px; font-weight: 700; color: #0A3026; white-space: nowrap; box-shadow: 0 1px 3px rgba(6, 40, 30, 0.15)">{{p.name}}</span>
    </a>
  </sc-for>

  <!-- Vị trí của bạn -->
  <sc-if value="{{gpsWeak}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: {{youHaloL}}; top: {{youHaloT}}; width: 96px; height: 96px; border-radius: 50%; background: rgba(212, 160, 23, 0.16); border: 1.5px dashed #B07D10; box-sizing: border-box"></div>
  </sc-if>
  <div aria-label="{{youLabel}}" role="img" style="position: absolute; left: {{youL}}; top: {{youT}}; width: 28px; height: 28px; border-radius: 50%; background: {{youHalo}}; display: flex; align-items: center; justify-content: center">
    <span style="width: 13px; height: 13px; border-radius: 50%; background: {{youDot}}; border: 2.5px solid #FFFFFF; box-shadow: 0 1px 4px rgba(6, 40, 30, 0.35); animation: sv-pulse 2s ease-out infinite"></span>
  </div>
  <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(238, 234, 224, 0.55)"></div>
    <span style="position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #0A3026; font-size: 11.5px; font-weight: 600; color: #FFFFFF"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F6BE39" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M3 3l18 18"></path></svg>Ngoại tuyến</span>
  </sc-if>

  <!-- La bàn & thước tỉ lệ -->
  <div aria-hidden="true" style="position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(6, 40, 30, 0.15); display: flex; flex-direction: column; align-items: center; justify-content: center">
    <svg width="12" height="14" viewBox="0 0 12 14"><path d="M6 0 11 13 6 10 1 13Z" fill="#C2413A"></path></svg>
    <span style="font-size: 9px; font-weight: 700; line-height: 1; color: #0A3026">B</span>
  </div>
  <!-- Chú giải -->
  <button type="button" aria-expanded="{{legendExpanded}}" onClick="{{toggleLegend}}" style="position: absolute; right: 6px; top: 46px; height: 44px; padding: 0 4px; border: none; background: transparent; display: flex; align-items: center; cursor: pointer; font-family: inherit"><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(6, 40, 30, 0.15); display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #0A3026"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0A3026" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>Chú giải</span></button>
  <sc-if value="{{legendOpen}}" hint-placeholder-val="{{ false }}">
    <div role="note" aria-label="Chú giải bản đồ" style="position: absolute; right: 10px; top: 92px; width: 176px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.97); box-shadow: 0 6px 18px rgba(6, 40, 30, 0.18); display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: #0A3026; z-index: 2">
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #1B4D3E; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #1B4D3E"></span>Phân khu đã đến</span>
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; border: 2px solid #1B4D3E; box-sizing: border-box"></span>Chưa đến</span>
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #185FA5; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #185FA5"></span>Có AR phục dựng</span>
