<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MiniPlayer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<a href="S12.dc.html" aria-label="Mở trình phát: {{title}}" style="width: 100%; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 999px; background: #0A3026; box-shadow: 0 8px 24px rgba(6, 40, 30, 0.22); text-decoration: none; font-family: Inter, sans-serif">
  <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; overflow: hidden; display: grid">
    <dc-import name="Photo" subject="{{subject}}" w="100%" h="100%" hide-label="yes" tone="dark" hint-size="40px,40px"></dc-import>
  </span>
  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
    <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span><span style="font-size: 11.5px; color: #A8CEBE">{{time}}</span></span>
    <span style="height: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden"><span style="display: block; width: {{progress}}; height: 100%; background: #F6BE39"></span></span>
  </span>
  <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#0A3026"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="#0A3026"></rect></svg></span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Thuyết minh · Điện Thái Hòa"},"subject":{"editor":"text","default":"Điện Thái Hòa"},"time":{"editor":"text","default":"1:12 / 4:00"},"progress":{"editor":"range","default":30,"min":0,"max":100,"unit":"%"},"$preview":{"width":369,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      title: this.props.title ?? 'Thuyết minh · Điện Thái Hòa',
      subject: this.props.subject ?? 'Điện Thái Hòa',
      time: this.props.time ?? '1:12 / 4:00',
      progress: (this.props.progress ?? 30) + '%'
    };
  }
}
</script>
</body>
</html>
